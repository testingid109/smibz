name: Ingest Explore Places

on:
  schedule:
    - cron: "0 3 * * *"   # daily at 03:00 UTC
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingestion on backend
        run: |
          curl -X POST "https://smibz.onrender.com/admin/ingest-places" \
            -H "X-Admin-Token: ${{ secrets.INGEST_ADMIN_TOKEN }}" \
            -H "Content-Type: application/json" \
            --fail --show-error
